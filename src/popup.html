    <section id="siteAccess" class="site-access-notice" role="status" hidden><strong>Site access needed</strong><p id="siteAccessText">Crossposter can’t read or post on the social sites until you allow access.</p><button id="allowSiteAccess" class="primary" type="button">Allow site access<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></section>

    <button id="openComposer" class="primary" type="button">Write a new post<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
